<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No internet connection</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 20px; line-height: 1.6; color: #1a1a1a; background: #ffffff; margin: 0; padding: 40px 16px; text-align: center; }
  h1 { color: #590d0d; font-size: 28px; }
  button { min-height: 56px; padding: 12px 32px; font-size: 20px; font-weight: 600; color: #ffffff; background: #590d0d; border: 0; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
  <h1>No internet connection</h1>
  <p>Your phone is not connected to the internet right now.<br>Please check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
