# Render Blueprint for the gstaichi.org API and the Tai Chi Company video worker.
# Schema: https://render.com/docs/blueprint-spec
#
# The website itself (public/ after `npm run build`) is hosted on HostGator; Render runs the Flask API, its Postgres database
# (which also serves /admin) and the background worker that prepares uploaded videos.
# Values marked "sync: false" are secrets: Render asks for them when you create the Blueprint, and they are
# never stored in this file. See .env.example for what each one is and where to get it.
# Step-by-step instructions: docs/LAUNCH_CHECKLIST.md

databases:
    # One database for the Books & DVDs store and The Tai Chi Company
    - name: gstaichi-db
      region: ohio
      plan: basic-256mb
      postgresMajorVersion: "17"
      databaseName: gstaichi
      user: gstaichi

envVarGroups:
    # Shared by the API and the worker, so both always use the same keys
    # (DATABASE_URL is set on each service below: a group cannot point at the database)
    - name: tai-chi-company-shared
      envVars:
          - key: BACKEND_URL # the API's public address, e.g. https://api.gstaichi.org (baked into every video)
            sync: false
          - key: FRONTEND_URL # the website, e.g. https://gstaichi.org (www. is allowed automatically)
            sync: false
          - key: KEY_ENCRYPTION_SECRET # never change after videos are uploaded, or they stop playing
            sync: false
          - key: MEDIA_BASE_URL # the video Worker; becomes https://media.gstaichi.org once DNS moves to Cloudflare
            value: https://tai-chi-company-media-test.tai-chi-company-media-worker.workers.dev
          - key: R2_ACCOUNT_ID
            sync: false
          - key: R2_ACCESS_KEY_ID
            sync: false
          - key: R2_SECRET_ACCESS_KEY
            sync: false
          - key: R2_MASTERS_BUCKET
            value: taichi-masters
          - key: R2_STREAMS_BUCKET
            value: taichi-streams
          - key: GMAIL
            sync: false
          - key: GMAIL_PASSWORD
            sync: false
          - key: PYTHON_VERSION
            value: 3.10.12

services:
    - type: web
      name: gstaichi-api
      runtime: python
      region: ohio
      plan: starter
      buildCommand: "./render_build.sh"
      startCommand: "gunicorn wsgi --chdir ./src/ --workers 2 --threads 4 --timeout 60"
      healthCheckPath: /api/tcc/settings
      envVars:
          - fromGroup: tai-chi-company-shared
          - key: DATABASE_URL
            fromDatabase:
                name: gstaichi-db
                property: connectionString
          - key: NOTIFICATION_EMAIL # where store order emails go (Vincent)
            sync: false
          - key: FLASK_APP
            value: src/app.py
          - key: FLASK_DEBUG
            value: 0
          - key: BASENAME
            value: /
          - key: FLASK_APP_KEY # signs the /admin sign-in cookie
            generateValue: true
          - key: JWT_SECRET_KEY # signs member sign-ins
            generateValue: true
          - key: MEDIA_TOKEN_SECRET # must match the Cloudflare Worker's MEDIA_TOKEN_SECRET
            sync: false
          - key: PAYPAL_MODE # sandbox while testing, live at launch
            value: sandbox
          - key: PAYPAL_CLIENT_ID
            sync: false
          - key: PAYPAL_CLIENT_SECRET
            sync: false
          - key: PAYPAL_WEBHOOK_ID
            sync: false
          - key: REDIS_URL # optional: shared rate limits across API instances
            sync: false

    - type: worker
      name: tai-chi-company-worker
      runtime: docker
      region: ohio
      plan: starter # encoding needs memory; move up to "standard" if long videos fail
      dockerfilePath: ./Dockerfile.worker
      dockerContext: .
      envVars:
          - fromGroup: tai-chi-company-shared
          - key: DATABASE_URL
            fromDatabase:
                name: gstaichi-db
                property: connectionString
          - key: ENCODE_PRESET
            value: veryfast
