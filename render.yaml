# Render Blueprint for the gstaichi.org API and the Tai Chi Company video worker.
# Schema: https://render.com/docs/blueprint-spec
#
# The website itself (public/ after `npm run build`) is hosted on HostGator; Render runs the Flask API, its Postgres database
# (which also serves /admin) and the background worker that prepares uploaded videos.
# Values marked "sync: false" are per-service secrets: Render asks for them when you create the Blueprint, never
# stores them in this file, and leaves them alone on every later sync. See .env.example for what each one is.
# Step-by-step instructions: docs/LAUNCH_CHECKLIST.md

databases:
    # One database for the Books & DVDs store and The Tai Chi Company
    - name: gstaichi-db
      region: ohio
      plan: basic-256mb
      postgresMajorVersion: "17"
      databaseName: gstaichi
      user: gstaichi

envVarGroups:
    # Plain settings shared by the API and the worker. This group is managed by the Blueprint: every sync
    # resets it to exactly these values, so never add keys to it in the dashboard.
    # (DATABASE_URL is set on each service below: a group cannot point at the database)
    - name: tai-chi-company-shared
      envVars:
          - key: MEDIA_BASE_URL # the video Worker (workers.dev until DNS moves to Cloudflare)
            value: https://tai-chi-company-media-test.tai-chi-company-media-worker.workers.dev
          - key: R2_MASTERS_BUCKET
            value: taichi-masters
          - key: R2_STREAMS_BUCKET
            value: taichi-streams
          - key: PYTHON_VERSION
            value: 3.10.12

    # Shared secrets live in a second group, tai-chi-company-secrets, which is created in the dashboard and
    # deliberately NOT defined here, so a Blueprint sync can never remove or blank its values. (Render
    # ignores "sync: false" inside a group defined in this file, which is how they were wiped before.)
    # It holds: BACKEND_URL (https://api.gstaichi.org, baked into every video), FRONTEND_URL,
    # KEY_ENCRYPTION_SECRET (never change after videos are uploaded, or they stop playing), R2_ACCOUNT_ID,
    # R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, GMAIL, GMAIL_PASSWORD.
    # Create it before syncing this file, or the sync fails. Steps: docs/LAUNCH_CHECKLIST.md step 4.

services:
    - type: web
      name: gstaichi-api
      runtime: python
      region: ohio
      plan: starter
      buildCommand: "./render_build.sh"
      preDeployCommand: "flask setup-database" # runs flask db upgrade (or creates the tables on an empty database)
      startCommand: "gunicorn wsgi --chdir ./src/ --workers 2 --threads 4 --timeout 60"
      healthCheckPath: /api/tcc/settings
      envVars:
          - fromGroup: tai-chi-company-shared
          - fromGroup: tai-chi-company-secrets # dashboard-only, see envVarGroups above
          - key: DATABASE_URL
            fromDatabase:
                name: gstaichi-db
                property: connectionString
          - key: NOTIFICATION_EMAIL # where store order emails go (Vincent)
            sync: false
          - key: FLASK_APP
            value: src/app.py
          - key: FLASK_DEBUG
            value: 0
          - key: BASENAME
            value: /
          - key: FLASK_APP_KEY # signs the /admin sign-in cookie
            generateValue: true
          - key: JWT_SECRET_KEY # signs member sign-ins
            generateValue: true
          - key: MEDIA_TOKEN_SECRET # must match the Cloudflare Worker's MEDIA_TOKEN_SECRET
            sync: false
          - key: PAYPAL_MODE # live since launch; set "sandbox" (and the PAYPAL_SANDBOX_* keys) to test again
            value: live
          - key: PAYPAL_CLIENT_ID
            sync: false
          - key: PAYPAL_CLIENT_SECRET
            sync: false
          - key: PAYPAL_WEBHOOK_ID
            sync: false
          - key: REDIS_URL # optional: shared rate limits across API instances
            sync: false

    - type: worker
      name: tai-chi-company-worker
      runtime: docker
      region: ohio
      plan: starter # encoding needs memory; move up to "standard" if long videos fail
      dockerfilePath: ./Dockerfile.worker
      dockerContext: .
      envVars:
          - fromGroup: tai-chi-company-shared
          - fromGroup: tai-chi-company-secrets # dashboard-only, see envVarGroups above
          - key: DATABASE_URL
            fromDatabase:
                name: gstaichi-db
                property: connectionString
          - key: ENCODE_PRESET
            value: veryfast
